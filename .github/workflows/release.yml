name: Build & Release nativa (Flutter)

# Flujo por app: cada app (inventario/pos/hosteleria) tiene su propia versión en
# `versions.json` y su propia release (`<appId>-vX.Y.Z`). Solo se compilan las
# apps cuyos archivos cambiaron (cualquier cambio en `lib/core/**` o `pubspec.*`
# afecta a las tres, porque es código compartido).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'versions.json'
  # Ejecución manual:
  #   apps=auto            -> detecta por archivos cambiados respecto al commit previo
  #   apps=all             -> publica las tres apps
  #   apps=inventario,pos  -> publica solo esas
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps a publicar: auto | all | inventario,pos,hosteleria'
        required: true
        default: 'auto'
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # prepare — detecta qué apps cambiaron y calcula la nueva versión de cada una
  # ---------------------------------------------------------------------------
  prepare:
    name: Detectar cambios y versiones
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      inv_changed: ${{ steps.plan.outputs.inv_changed }}
      inv_version: ${{ steps.plan.outputs.inv_version }}
      pos_changed: ${{ steps.plan.outputs.pos_changed }}
      pos_version: ${{ steps.plan.outputs.pos_version }}
      host_changed: ${{ steps.plan.outputs.host_changed }}
      host_version: ${{ steps.plan.outputs.host_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar rutas cambiadas
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'lib/core/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'assets/**'
              - 'windows/**'
              - 'linux/**'
              - 'android/**'
              - '.github/workflows/release.yml'
            inventario:
              - 'lib/main.dart'
              - 'lib/features/{activos,auth,calculadora,configuracion,historial,inventario,producciones,requisiciones,reportes,stock,validacion,whatsapp}/**'
              - 'web/**'
            pos:
              - 'lib/main_pos.dart'
              - 'lib/features/pos/**'
              - 'web_pos/**'
            hosteleria:
              - 'lib/main_hosteleria.dart'
              - 'lib/features/hosteleria/**'
              - 'web_hosteleria/**'

      - name: Calcular versiones
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          APP_INPUT='${{ github.event.inputs.apps }}'
          if [ -z "$APP_INPUT" ]; then APP_INPUT='auto'; fi

          SHARED='${{ steps.filter.outputs.shared }}'
          FIL_INV='${{ steps.filter.outputs.inventario }}'
          FIL_POS='${{ steps.filter.outputs.pos }}'
          FIL_HOST='${{ steps.filter.outputs.hosteleria }}'

          chg_inv=false; chg_pos=false; chg_host=false
          if [ "$APP_INPUT" = "all" ]; then
            chg_inv=true; chg_pos=true; chg_host=true
          elif [ "$APP_INPUT" != "auto" ]; then
            case ",$APP_INPUT," in *",inventario,"*) chg_inv=true;; esac
            case ",$APP_INPUT," in *",pos,"*) chg_pos=true;; esac
            case ",$APP_INPUT," in *",hosteleria,"*) chg_host=true;; esac
          else
            if [ "$SHARED" = "true" ]; then
              chg_inv=true; chg_pos=true; chg_host=true
            fi
            if [ "$FIL_INV" = "true" ]; then chg_inv=true; fi
            if [ "$FIL_POS" = "true" ]; then chg_pos=true; fi
            if [ "$FIL_HOST" = "true" ]; then chg_host=true; fi
          fi

          # Sube el componente patch: 2.0.1 -> 2.0.2
          bump() { echo "$1" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}'; }

          inv_v=$(jq -r '.inventario.version' versions.json)
          pos_v=$(jq -r '.pos.version' versions.json)
          host_v=$(jq -r '.hosteleria.version' versions.json)
          if [ "$chg_inv" = true ]; then inv_v=$(bump "$inv_v"); fi
          if [ "$chg_pos" = true ]; then pos_v=$(bump "$pos_v"); fi
          if [ "$chg_host" = true ]; then host_v=$(bump "$host_v"); fi

          any=false
          if [ "$chg_inv" = true ] || [ "$chg_pos" = true ] || [ "$chg_host" = true ]; then
            any=true
          fi

          {
            echo "any=$any"
            echo "inv_changed=$chg_inv"
            echo "inv_version=$inv_v"
            echo "pos_changed=$chg_pos"
            echo "pos_version=$pos_v"
            echo "host_changed=$chg_host"
            echo "host_version=$host_v"
          } >> "$GITHUB_OUTPUT"

          echo "any=$any inv=$chg_inv($inv_v) pos=$chg_pos($pos_v) host=$chg_host($host_v)"

  # ---------------------------------------------------------------------------
  # Windows — POS, inventario y Hostelería
  # ---------------------------------------------------------------------------
  windows-pos:
    name: Windows POS (zip)
    needs: prepare
    if: needs.prepare.outputs.pos_changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Actualizar version en pubspec.yaml
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml) -replace 'version: .+', "version: ${{ needs.prepare.outputs.pos_version }}+1" | Set-Content pubspec.yaml
      - name: Build Windows POS
        env:
          LYCORIS_BINARY_NAME: LycorisPOS
        run: |
          Copy-Item windows\runner\resources\app_icon_pos.ico `
            windows\runner\resources\app_icon.ico -Force
          flutter pub get
          flutter build windows --release -t lib/main_pos.dart `
            --dart-define=APP_ID=pos `
            --dart-define=APP_LABEL="Lycoris POS" `
            --dart-define=APP_VERSION=${{ needs.prepare.outputs.pos_version }} `
            --dart-define=WHATSAPP_BOT_TOKEN=${{ secrets.WHATSAPP_BOT_TOKEN }}
      - name: Empaquetar zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath app-pos-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-pos-windows
          path: app-pos-windows.zip

  windows-inventario:
    name: Windows Inventario (zip)
    needs: prepare
    if: needs.prepare.outputs.inv_changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Actualizar version en pubspec.yaml
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml) -replace 'version: .+', "version: ${{ needs.prepare.outputs.inv_version }}+1" | Set-Content pubspec.yaml
      - name: Build Windows Inventario
        env:
          LYCORIS_BINARY_NAME: LycorisControl
        run: |
          Copy-Item windows\runner\resources\app_icon_inventario.ico `
            windows\runner\resources\app_icon.ico -Force
          flutter pub get
          flutter build windows --release `
            --dart-define=APP_ID=inventario `
            --dart-define=APP_LABEL="Control de Entradas y Salidas" `
            --dart-define=APP_VERSION=${{ needs.prepare.outputs.inv_version }} `
            --dart-define=WHATSAPP_BOT_TOKEN=${{ secrets.WHATSAPP_BOT_TOKEN }}
      - name: Empaquetar zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath app-inventario-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-inventario-windows
          path: app-inventario-windows.zip

  windows-hosteleria:
    name: Windows Hostelería (zip)
    needs: prepare
    if: needs.prepare.outputs.host_changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Actualizar version en pubspec.yaml
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml) -replace 'version: .+', "version: ${{ needs.prepare.outputs.host_version }}+1" | Set-Content pubspec.yaml
      - name: Build Windows Hostelería
        env:
          LYCORIS_BINARY_NAME: LycorisHostel
        run: |
          Copy-Item windows\runner\resources\app_icon_hosteleria.ico `
            windows\runner\resources\app_icon.ico -Force
          flutter pub get
          flutter build windows --release -t lib/main_hosteleria.dart `
            --dart-define=APP_ID=hosteleria `
            --dart-define=APP_LABEL="Lycoris Hostelería" `
            --dart-define=APP_VERSION=${{ needs.prepare.outputs.host_version }} `
            --dart-define=WHATSAPP_BOT_TOKEN=${{ secrets.WHATSAPP_BOT_TOKEN }}
      - name: Empaquetar zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath app-hosteleria-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-hosteleria-windows
          path: app-hosteleria-windows.zip

  # ---------------------------------------------------------------------------
  # Linux — POS e inventario (solo si alguno cambió)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux POS & Inventario (tar.gz)
    needs: prepare
    if: needs.prepare.outputs.pos_changed == 'true' || needs.prepare.outputs.inv_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Instalar dependencias del sistema (Linux desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev
      - name: Build Linux POS
        if: needs.prepare.outputs.pos_changed == 'true'
        env:
          WHATSAPP_BOT_TOKEN: ${{ secrets.WHATSAPP_BOT_TOKEN }}
        run: |
          sed -i "s/^version: .*/version: ${{ needs.prepare.outputs.pos_version }}+1/" pubspec.yaml
          flutter pub get
          flutter build linux --release -t lib/main_pos.dart \
            --dart-define=APP_ID=pos \
            --dart-define=APP_LABEL="Lycoris POS" \
            --dart-define=APP_VERSION=${{ needs.prepare.outputs.pos_version }} \
            --dart-define=WHATSAPP_BOT_TOKEN=${WHATSAPP_BOT_TOKEN}
          cd build/linux/x64/release
          cp -r bundle lycoris-pos
          mv lycoris-pos/control_entradas_salidas lycoris-pos/LycorisPOS
          tar -czf ../../../../app-pos-linux.tar.gz -C lycoris-pos .
      - name: Build Linux Inventario
        if: needs.prepare.outputs.inv_changed == 'true'
        env:
          WHATSAPP_BOT_TOKEN: ${{ secrets.WHATSAPP_BOT_TOKEN }}
        run: |
          sed -i "s/^version: .*/version: ${{ needs.prepare.outputs.inv_version }}+1/" pubspec.yaml
          flutter pub get
          flutter build linux --release -t lib/main.dart \
            --dart-define=APP_ID=inventario \
            --dart-define=APP_LABEL="Control de Entradas y Salidas" \
            --dart-define=APP_VERSION=${{ needs.prepare.outputs.inv_version }} \
            --dart-define=WHATSAPP_BOT_TOKEN=${WHATSAPP_BOT_TOKEN}
          cd build/linux/x64/release
          cp -r bundle lycoris-inventario
          mv lycoris-inventario/control_entradas_salidas lycoris-inventario/LycorisControl
          tar -czf ../../../../app-inventario-linux.tar.gz -C lycoris-inventario .
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.pos_changed == 'true'
        with:
          name: app-pos-linux
          path: app-pos-linux.tar.gz
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.inv_changed == 'true'
        with:
          name: app-inventario-linux
          path: app-inventario-linux.tar.gz

  # ---------------------------------------------------------------------------
  # Android — inventario (APK)
  # ---------------------------------------------------------------------------
  android:
    name: Android Inventario (APK)
    needs: prepare
    if: needs.prepare.outputs.inv_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Actualizar version en pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ needs.prepare.outputs.inv_version }}+1/" pubspec.yaml
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/release.p12
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../release.p12
          EOF
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=APP_ID=inventario \
            --dart-define=APP_LABEL="Control de Entradas y Salidas" \
            --dart-define=APP_VERSION=${{ needs.prepare.outputs.inv_version }} \
            --dart-define=WHATSAPP_BOT_TOKEN=${{ secrets.WHATSAPP_BOT_TOKEN }}
      - name: Copiar con nombre estable
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-inventario-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-inventario-android
          path: app-inventario-android.apk

  # ---------------------------------------------------------------------------
  # release — publica una release por app que cambió y actualiza versions.json
  # ---------------------------------------------------------------------------
  release:
    name: Publicar releases por app
    needs: [prepare, windows-pos, windows-inventario, windows-hosteleria, linux, android]
    if: >-
      always() && needs.prepare.outputs.any == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          create_release() {
            local tag="$1"; shift
            local title="$1"; shift
            if [ "$#" -eq 0 ]; then
              echo "Sin assets para $tag, se omite"
              return 0
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$@" --clobber
            else
              gh release create "$tag" "$@" \
                --title "$title" \
                --notes "Build nativo Flutter. Versión publicada por app."
            fi
          }

          if [ "${{ needs.prepare.outputs.inv_changed }}" = "true" ]; then
            files=()
            for f in app-inventario-windows.zip app-inventario-linux.tar.gz app-inventario-android.apk; do
              if [ -f "artifacts/$f" ]; then files+=("artifacts/$f"); fi
            done
            create_release "inventario-v${{ needs.prepare.outputs.inv_version }}" \
              "Inventario v${{ needs.prepare.outputs.inv_version }}" ${files[@]+"${files[@]}"}
          fi

          if [ "${{ needs.prepare.outputs.pos_changed }}" = "true" ]; then
            files=()
            for f in app-pos-windows.zip app-pos-linux.tar.gz; do
              if [ -f "artifacts/$f" ]; then files+=("artifacts/$f"); fi
            done
            create_release "pos-v${{ needs.prepare.outputs.pos_version }}" \
              "POS v${{ needs.prepare.outputs.pos_version }}" ${files[@]+"${files[@]}"}
          fi

          if [ "${{ needs.prepare.outputs.host_changed }}" = "true" ]; then
            files=()
            for f in app-hosteleria-windows.zip; do
              if [ -f "artifacts/$f" ]; then files+=("artifacts/$f"); fi
            done
            create_release "hosteleria-v${{ needs.prepare.outputs.host_version }}" \
              "Hostelería v${{ needs.prepare.outputs.host_version }}" ${files[@]+"${files[@]}"}
          fi

      - name: Actualizar versions.json
        run: |
          set -euo pipefail
          jq -n \
            --arg i "${{ needs.prepare.outputs.inv_version }}" \
            --arg p "${{ needs.prepare.outputs.pos_version }}" \
            --arg h "${{ needs.prepare.outputs.host_version }}" \
            '{inventario:{version:$i}, pos:{version:$p}, hosteleria:{version:$h}}' \
            > versions.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --cached --quiet; then
            echo "versions.json sin cambios"
          else
            git commit -m "chore(release): versions.json -> inv ${{ needs.prepare.outputs.inv_version }}, pos ${{ needs.prepare.outputs.pos_version }}, host ${{ needs.prepare.outputs.host_version }} [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
