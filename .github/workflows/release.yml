name: Build & Release nativa (Flutter)

on:
  # Publicar una release manual: selecciona "Run workflow" y pon la versión.
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de la release (ej: 1.0.0). Se crea el tag vX.Y.Z.'
        required: true
        type: string
  # O al empujar un tag vX.Y.Z (también publica la release).
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # Windows — POS (main_pos.dart) y inventario (main.dart)
  # ---------------------------------------------------------------------------
  windows-pos:
    name: Windows POS (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Determinar version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Actualizar version en pubspec.yaml
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          (Get-Content pubspec.yaml) -replace 'version: .+', "version: $version+1" | Set-Content pubspec.yaml
          Write-Host "Version actualizada a $version"
      - name: Build Windows POS
        env:
          LYCORIS_BINARY_NAME: LycorisPOS
        run: |
          Copy-Item windows\runner\resources\app_icon_pos.ico `
            windows\runner\resources\app_icon.ico -Force
          flutter pub get
          flutter build windows --release -t lib/main_pos.dart `
            --dart-define=APP_ID=pos `
            --dart-define=APP_LABEL="Lycoris POS" `
            --dart-define=WHATSAPP_BOT_TOKEN=${{ secrets.WHATSAPP_BOT_TOKEN }}
      - name: Empaquetar zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath app-pos-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-pos-windows
          path: app-pos-windows.zip

  windows-inventario:
    name: Windows Inventario (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Determinar version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Actualizar version en pubspec.yaml
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          (Get-Content pubspec.yaml) -replace 'version: .+', "version: $version+1" | Set-Content pubspec.yaml
          Write-Host "Version actualizada a $version"
      - name: Build Windows Inventario
        env:
          LYCORIS_BINARY_NAME: LycorisControl
        run: |
          Copy-Item windows\runner\resources\app_icon_inventario.ico `
            windows\runner\resources\app_icon.ico -Force
          flutter pub get
          flutter build windows --release `
            --dart-define=APP_ID=inventario `
            --dart-define=APP_LABEL="Control de Entradas y Salidas" `
            --dart-define=WHATSAPP_BOT_TOKEN=${{ secrets.WHATSAPP_BOT_TOKEN }}
      - name: Empaquetar zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath app-inventario-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-inventario-windows
          path: app-inventario-windows.zip

  # ---------------------------------------------------------------------------
  # Android — inventario (main.dart) en APK
  # ---------------------------------------------------------------------------
  android:
    name: Android Inventario (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Determinar version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Actualizar version en pubspec.yaml
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          sed -i "s/^version: .*/version: $VERSION+1/" pubspec.yaml
          echo "Version actualizada a $VERSION"
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/release.p12
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../release.p12
          EOF
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=APP_ID=inventario \
            --dart-define=APP_LABEL="Control de Entradas y Salidas" \
            --dart-define=WHATSAPP_BOT_TOKEN=${{ secrets.WHATSAPP_BOT_TOKEN }}
      - name: Copiar con nombre estable
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-inventario-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-inventario-android
          path: app-inventario-android.apk

  # ---------------------------------------------------------------------------
  # Release — junta los 3 assets en una GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publicar GitHub Release
    needs: [windows-pos, windows-inventario, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determinar versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crear tag (workflow_dispatch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.tag }}"
          git push origin "v${{ steps.version.outputs.tag }}"
        if: github.event_name == 'workflow_dispatch'

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.tag }}" \
            artifacts/app-pos-windows.zip \
            artifacts/app-inventario-windows.zip \
            artifacts/app-inventario-android.apk \
            --title "Lycoris v${{ steps.version.outputs.tag }}" \
            --notes "Build nativo Flutter. POS (Windows) + Inventario (Windows/Android)."
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'