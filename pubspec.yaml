name: control_entradas_salidas
description: Control de Entradas y Salidas + POS (migración Flet -> Flutter)
publish_to: 'none'
version: 2.0.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (Postgres REST, auth, storage, realtime)
  supabase_flutter: ^2.8.0
  # Estado y navegación
  flutter_riverpod: ^2.5.1
  # Red
  http: ^1.2.0
  # Almacenamiento seguro (credenciales, tokens, .env-like)
  flutter_secure_storage: ^9.2.0
  # Cache local (stale-while-revalidate para catalogos)
  shared_preferences: ^2.2.0
  # Utilidades
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  crypto: ^3.0.3
  file_selector: ^1.0.3
  file_selector_web: ^0.9.5
  excel: ^4.0.6
  package_info_plus: ^9.0.1
  # Impresión térmica nativa (Windows): envía bytes ESC/POS raw a la impresora
  # vía RAW datatype. No tiene efecto en web/Android (se usa preview + diálogo).
  windows_printer: ^0.2.1
  # Decodificar/encodear imágenes (BMP→JPEG para WhatsApp)
  image: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icono_azul.png
