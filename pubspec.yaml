name: control_entradas_salidas
description: Control de Entradas y Salidas + POS (migración Flet -> Flutter)
publish_to: 'none'
version: 2.1.10+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Localizaciones de Material/Cupertino: calendarios y pickers en español.
  flutter_localizations:
    sdk: flutter

  # PostgreSQL directo (driver nativo Dart, reemplaza supabase_flutter)
  postgres: ^3.4.0
  # Estado y navegación
  flutter_riverpod: ^2.5.1
  # Red
  http: ^1.2.0
  # Almacenamiento seguro (credenciales, tokens, .env-like)
  flutter_secure_storage: ^9.2.0
  # Cache local (stale-while-revalidate para catalogos)
  shared_preferences: ^2.2.0
  # Utilidades
  # flutter_localizations fija la versión de intl según el SDK de Flutter;
  # se permite 0.19.x y 0.20.x para evitar conflictos de resolución.
  intl: ">=0.19.0 <0.21.0"
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  crypto: ^3.0.3
  file_selector: ^1.0.3
  file_selector_web: ^0.9.5
  excel: ^4.0.6
  package_info_plus: ^9.0.1
  # Impresión térmica nativa (Windows): envía bytes ESC/POS raw a la impresora
  # vía RAW datatype. No tiene efecto en web/Android (se usa preview + diálogo).
  windows_printer: ^0.2.1
  # Decodificar/encodear imágenes (BMP→JPEG para WhatsApp)
  image: ^4.3.0
  # Cámara del teléfono para identificar activos por foto (Android/iOS).
  # En escritorio se elige una imagen con file_selector.
  image_picker: ^1.1.2

  # SQLite local para pruebas del módulo Hostelería (no toca la BD real de Postgres)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icono_azul.png
    - assets/icono_morado.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  windows: true
  macos: true
  web: true
  image_path: "assets/icono_morado.png"
  adaptive_icon_background: "#1A1530"
  adaptive_icon_foreground: "assets/icono_morado.png"
